name: Pages

# The project page at https://suchun-sv.github.io/Gleeok/, rebuilt when the page or the README's
# animations change and after each release (the download links name the release's files).
on:
  push:
    branches: [main]
    paths: [site/**, docs/screenshots/*.webp, .github/workflows/pages.yml]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build
        env:
          GH_TOKEN: ${{ github.token }}
        run: site/build.sh _site "$(gh release view --json tagName -q .tagName)"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
