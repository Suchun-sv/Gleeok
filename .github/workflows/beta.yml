# The beta channel: every push to main builds Gleeok's code alone (dist/, vendor/, assets/) into the
# rolling "beta" prerelease, where installed builds on the beta channel pick it up as a hot update
# (app/src/main/hot-update.ts). No Electron, no installers, about a minute.
name: Beta

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: beta
  # Never stop one mid-upload; a newer push waits (and replaces any other waiting one).
  cancel-in-progress: false

jobs:
  hot:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --no-fund --no-audit
        env:
          # Only the code is shipped; Electron itself is not needed to build it.
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: npm run build
        env:
          GLEEOK_COMMIT: ${{ github.sha }}
      - name: Bundle
        run: |
          # Named by commit: an archive is never replaced, so a client never finds it half-uploaded.
          file="hot-${GITHUB_SHA::12}.tar.gz"
          tar -czf "../$file" dist vendor assets
          cp "../$file" ../hot.tar.gz
          node ../dev/hot-manifest.mjs "../$file" "$file" > ../hot.json
          cat ../hot.json
      - name: Publish to the beta prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view beta >/dev/null 2>&1 || gh release create beta --prerelease --target "$GITHUB_SHA" \
            --title "Gleeok 测试版（热更新）" \
            --notes "测试版通道的热更新包：main 上每次提交都会更新这里的 hot.tar.gz / hot.json。正式版的安装包在其他 Release 里。"
          # The archive first, then the manifest that points at it.
          gh release upload beta ../hot-*.tar.gz --clobber
          # hot.tar.gz for 0.1.0, which downloads that name.
          gh release upload beta ../hot.tar.gz --clobber
          gh release upload beta ../hot.json --clobber
          # Keep the five newest archives (a client may still hold an older manifest for a while).
          gh release view beta --json assets -q '.assets[] | select(.name | startswith("hot-")) | "\(.createdAt) \(.name)"' \
            | sort -r | tail -n +6 | cut -d' ' -f2 | while read -r old; do gh release delete-asset beta "$old" -y; done
